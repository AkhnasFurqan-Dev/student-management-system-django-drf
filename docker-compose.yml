services:
  db:
    image: postgres:16
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_dev
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: sms_pass
    ports:
      - "5432:5432"
    volumes:
      - sms_pgdata:/var/lib/postgresql/data

volumes:
  sms_pgdata: